<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwitterClone - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <a class="brand" href="index.html">TwitterClone</a>
      <h1 id="login-title">Login to your account</h1>
      <p>Welcome back. Continue to your timeline.</p>

      <form>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" minlength="6" required />

        <div class="form-row">
          <label class="check-label">
            <input type="checkbox" name="remember" />
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button class="social-button" type="button">Continue with Google</button>
      <button class="social-button" type="button">Continue with phone</button>

      <p class="switch-page">Do not have an account? <a href="register.html">Register</a></p>
    </section>
  </main>
</body>
</html>
