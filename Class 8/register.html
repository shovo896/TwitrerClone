<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwitterClone - Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card wide" aria-labelledby="register-title">
      <a class="brand" href="index.html">TwitterClone</a>
      <h1 id="register-title">Create your account</h1>
      <p>Join the conversation with a new profile.</p>

      <form>
        <div class="two-column">
          <div>
            <label for="firstName">First name</label>
            <input id="firstName" name="firstName" type="text" placeholder="First name" autocomplete="given-name" required />
          </div>
          <div>
            <label for="lastName">Last name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Last name" autocomplete="family-name" required />
          </div>
        </div>

        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="@username" autocomplete="username" required />

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required />

        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="+880 1XXXXXXXXX" autocomplete="tel" pattern="[+\d\s-]{7,}" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required />

        <button type="submit">Create account</button>
      </form>

      <p class="terms">By signing up, you agree to the Terms of Service, Privacy Policy, and Cookie Policy.</p>
      <p class="switch-page">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>
</body>
</html>
